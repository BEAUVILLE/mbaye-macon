name: Optimiser media Mbaye Diouf

on:
  push:
    paths:
      - '.github/workflows/optimiser-media-mbaye-temp.yml'

permissions:
  contents: write

jobs:
  optimiser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer convertisseurs
        run: |
          sudo apt-get update
          sudo apt-get install -y webp libavif-bin

      - name: Rapatrier le logo DIGIYLYFE
        run: |
          set -euo pipefail
          mkdir -p assets/mbaye
          curl -fsSL 'https://digiylyfe.net/wp-content/uploads/2026/03/digiylyfe_logo_qr.jpeg' -o assets/mbaye/logo-digiylyfe.jpeg

      - name: Convertir les medias en WebP et AVIF
        run: |
          set -euo pipefail
          cwebp -quiet -q 82 carte-visite.png -o carte-visite.webp
          avifenc --min 28 --max 35 --speed 6 carte-visite.png carte-visite.avif >/dev/null
          cwebp -quiet -q 82 assets/mbaye/logo-digiylyfe.jpeg -o assets/mbaye/logo-digiylyfe.webp
          avifenc --min 28 --max 35 --speed 6 assets/mbaye/logo-digiylyfe.jpeg assets/mbaye/logo-digiylyfe.avif >/dev/null

      - name: Basculer la fiche vers les formats legers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_logo='<div class="logo"><img id="logoImg" alt="Logo DIGIYLYFE" src="https://digiylyfe.net/wp-content/uploads/2026/03/digiylyfe_logo_qr.jpeg"></div>'
          new_logo='''<div class="logo"><picture class="digiy-logo-picture"><source type="image/avif" srcset="assets/mbaye/logo-digiylyfe.avif"><source type="image/webp" srcset="assets/mbaye/logo-digiylyfe.webp"><img id="logoImg" alt="Logo DIGIYLYFE" src="assets/mbaye/logo-digiylyfe.jpeg" decoding="async"></picture></div>'''
          if old_logo not in s:
              raise SystemExit('Logo Mbaye introuvable')
          s=s.replace(old_logo,new_logo,1)

          old_poster='<div class="poster"><img id="poster" alt="Mbaye Diouf" src="./carte-visite.png?v=20260814-adherent"></div>'
          new_poster='''<div class="poster"><picture class="digiy-poster-picture"><source type="image/avif" srcset="./carte-visite.avif"><source type="image/webp" srcset="./carte-visite.webp"><img id="poster" alt="Mbaye Diouf" src="./carte-visite.png?v=20260814-adherent" decoding="async"></picture></div>'''
          if old_poster not in s:
              raise SystemExit('Poster Mbaye introuvable')
          s=s.replace(old_poster,new_poster,1)

          marker='/* DIGIY media opt Mbaye Diouf 20260830 */'
          if marker not in s:
              css='''\n/* DIGIY media opt Mbaye Diouf 20260830 */\n.logo picture.digiy-logo-picture{display:block;width:100%;height:100%}\n.logo picture.digiy-logo-picture img{width:100%;height:100%;object-fit:cover}\n.poster picture.digiy-poster-picture{display:block;width:100%}\n.poster picture.digiy-poster-picture img{width:100%;max-height:760px;object-fit:contain;padding:10px}\n'''
              s=s.replace('</style>',css+'</style>',1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Controler le gain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for group in [
              ('poster', Path('carte-visite.png'), Path('carte-visite.webp'), Path('carte-visite.avif')),
              ('logo', Path('assets/mbaye/logo-digiylyfe.jpeg'), Path('assets/mbaye/logo-digiylyfe.webp'), Path('assets/mbaye/logo-digiylyfe.avif')),
          ]:
              name, original, webp, avif = group
              print(f'{name} original={original.stat().st_size} webp={webp.stat().st_size} avif={avif.stat().st_size}')
          PY

      - name: Publier optimisation
        run: |
          set -euo pipefail
          git config user.name 'DIGIYLYFE Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html carte-visite.webp carte-visite.avif assets/mbaye
          if git diff --cached --quiet; then
            echo 'Aucun changement a publier.'
            exit 0
          fi
          git commit -m 'Media: optimiser Mbaye Diouf en AVIF et WebP'
          git push
